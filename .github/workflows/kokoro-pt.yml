name: AXEV — Kokoro Narração PT

on:
  workflow_dispatch:
    inputs:
      texto_custom:
        description: |
          Texto personalizado (opcional). Se preenchido, substitui o texto padrão.
          Podes colar aqui directamente o teu texto.
        required: false
        default: ''
      bloco:
        description: 'Qual bloco narrar?'
        required: true
        default: 'TODOS'
        type: choice
        options:
          - TODOS
          - BLOCO_1
          - BLOCO_2
          - BLOCO_3
          - BLOCO_4
          - BLOCO_5
      voz:
        description: 'Voz portuguesa'
        required: true
        default: 'pf_dora'
        type: choice
        options:
          - pf_dora
          - pm_alex
          - pm_santa
      velocidade:
        description: 'Velocidade da narração (0.8 = lenta, 1.0 = normal, 1.2 = rápida)'
        required: true
        default: '1.0'
        type: choice
        options:
          - '0.8'
          - '0.9'
          - '1.0'
          - '1.1'
          - '1.2'
      formato:
        description: 'Formato de saída'
        required: true
        default: 'wav+mp3'
        type: choice
        options:
          - wav+mp3
          - wav
          - mp3

# ══════════════════════════════════════════════════════════════════════
# TEXTOS PADRÃO — HUMANIDADE E O FUTURO
# Para usar um texto diferente, preenche "texto_custom" no input acima
# ══════════════════════════════════════════════════════════════════════
env:
  BLOCO_1: >-
    A humanidade e o futuro.
    Esta disciplina procura compreender para onde caminha a humanidade
    e que consequências as decisões do presente podem ter no futuro.
    No passado, a ciência concentrava-se sobretudo em estudar o que já aconteceu.
    Actualmente, também procura compreender o que poderá acontecer.
    Surgem assim os estudos prospectivos,
    estudos que procuram antecipar cenários futuros
    a partir das tendências e conhecimentos do presente.

  BLOCO_2: >-
    O tempo avança numa direcção, mas o futuro não precisa de estar completamente determinado.
    A flecha do tempo é uma metáfora proposta pelo físico Arthur Eddington,
    em mil novecentos e vinte e sete,
    para representar a direcção do tempo: do passado para o presente,
    e do presente para o futuro.
    Certos acontecimentos naturais acontecem numa direcção e não podem ser invertidos.
    Um copo que se parte não regressa espontaneamente à sua forma original.
    O envelhecimento humano não pode ser revertido naturalmente.

  BLOCO_3: >-
    O futuro não é necessariamente único, fixo ou completamente determinado.
    Existem várias possibilidades que podem acontecer.
    O ser humano pode tomar decisões.
    As decisões podem alterar o rumo dos acontecimentos.
    Diferentes escolhas podem produzir diferentes consequências.
    Uma decisão tomada hoje pode alterar o futuro de uma pessoa,
    de uma sociedade ou de uma nação.

  BLOCO_4: >-
    A maneira como o ser humano compreende o mundo não permanece sempre igual.
    Um paradigma é um modelo, uma referência, uma estrutura de pensamento
    que orienta a maneira como interpretamos a realidade.
    É como uma lente através da qual observamos o mundo.
    Dependendo da lente que utilizamos,
    podemos interpretar o mesmo fenómeno de maneiras completamente diferentes.

  BLOCO_5: >-
    Do mecanicismo ao holismo.
    O mecanicismo compreende a realidade através de partes separadas.
    O holismo procura compreender o todo e as relações entre as suas partes.
    Para compreender a saúde de uma pessoa, não basta analisar um órgão isoladamente.
    É necessário considerar o organismo, o ambiente
    e todos os factores que influenciam a vida.
    A realidade é complexa e interligada.

jobs:
  narrar:
    name: "🎙️ Kokoro PT — ${{ github.event.inputs.voz }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verificar ambiente
        run: |
          python3 --version
          free -h && df -h /

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Instalar kokoro-onnx
        run: |
          python3 -m venv venv_kokoro
          source venv_kokoro/bin/activate
          pip install --quiet --upgrade pip wheel
          pip install --quiet kokoro-onnx soundfile numpy
          python -c "import kokoro_onnx; print('✓ kokoro-onnx OK')"

      - name: Descarregar modelo Kokoro ONNX
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import urllib.request, os
          os.makedirs("kokoro_model", exist_ok=True)
          files = {
            "kokoro.onnx": "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx",
            "voices.bin":  "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin",
          }
          for name, url in files.items():
            print(f"A descarregar {name}...")
            urllib.request.urlretrieve(url, f"kokoro_model/{name}")
          print("✓ Modelo pronto")
          PYEOF

      - name: Preparar texto para narração
        id: texto
        run: |
          # Se o utilizador forneceu texto custom, usa esse.
          # Caso contrário, selecciona o bloco padrão (ou concatena todos).
          CUSTOM="${{ github.event.inputs.texto_custom }}"
          BLOCO="${{ github.event.inputs.bloco }}"

          if [ -n "$CUSTOM" ]; then
            echo "Modo: texto personalizado"
            printf '%s' "$CUSTOM" > narration_text.txt
          elif [ "$BLOCO" = "TODOS" ]; then
            echo "Modo: todos os blocos"
            {
              printf '%s\n\n' "$BLOCO_1"
              printf '%s\n\n' "$BLOCO_2"
              printf '%s\n\n' "$BLOCO_3"
              printf '%s\n\n' "$BLOCO_4"
              printf '%s'    "$BLOCO_5"
            } > narration_text.txt
          else
            echo "Modo: bloco $BLOCO"
            case "$BLOCO" in
              BLOCO_1) printf '%s' "$BLOCO_1" > narration_text.txt ;;
              BLOCO_2) printf '%s' "$BLOCO_2" > narration_text.txt ;;
              BLOCO_3) printf '%s' "$BLOCO_3" > narration_text.txt ;;
              BLOCO_4) printf '%s' "$BLOCO_4" > narration_text.txt ;;
              BLOCO_5) printf '%s' "$BLOCO_5" > narration_text.txt ;;
            esac
          fi

          echo "=== Texto a narrar ==="
          cat narration_text.txt
          echo "======================"
          CHARS=$(wc -c < narration_text.txt)
          echo "Caracteres: $CHARS"
        env:
          BLOCO_1: ${{ env.BLOCO_1 }}
          BLOCO_2: ${{ env.BLOCO_2 }}
          BLOCO_3: ${{ env.BLOCO_3 }}
          BLOCO_4: ${{ env.BLOCO_4 }}
          BLOCO_5: ${{ env.BLOCO_5 }}

      - name: Gerar narração — Kokoro PT
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import kokoro_onnx, soundfile as sf, json, os, time, numpy as np

          VOICE = "${{ github.event.inputs.voz }}"
          SPEED = float("${{ github.event.inputs.velocidade }}")
          BLOCO = "${{ github.event.inputs.bloco }}"

          with open("narration_text.txt", "r") as f:
            TEXT = f.read().strip()

          os.makedirs("results/audio", exist_ok=True)
          label = "custom" if "${{ github.event.inputs.texto_custom }}" else BLOCO.lower()
          out_wav = f"results/audio/{VOICE}_{label}.wav"

          print(f"Voz    : {VOICE}")
          print(f"Speed  : {SPEED}")
          print(f"Bloco  : {label}")
          print(f"Chars  : {len(TEXT)}")
          print()

          print("A inicializar Kokoro ONNX...")
          kokoro = kokoro_onnx.Kokoro("kokoro_model/kokoro.onnx", "kokoro_model/voices.bin")

          t0 = time.time()
          samples, sr = kokoro.create(TEXT, voice=VOICE, speed=SPEED, lang="pt-br")
          elapsed = time.time() - t0
          dur = len(samples) / sr

          sf.write(out_wav, samples, sr)
          print(f"✓ {out_wav}")
          print(f"  Duração : {dur:.1f}s")
          print(f"  Geração : {elapsed:.1f}s")

          meta = {
            "voice": VOICE, "speed": SPEED, "bloco": label,
            "duration_s": round(dur, 2), "generation_s": round(elapsed, 2),
            "chars": len(TEXT), "file": out_wav, "status": "OK"
          }
          with open("results/audio/metadata.json", "w") as f:
            json.dump(meta, f, indent=2, ensure_ascii=False)
          PYEOF

      - name: Converter para MP3
        if: ${{ contains(github.event.inputs.formato, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/audio/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
            echo "✓ MP3: ${wav%.wav}.mp3"
          done

      - name: Remover WAV (se formato só MP3)
        if: ${{ github.event.inputs.formato == 'mp3' }}
        run: rm -f results/audio/*.wav

      - name: Mostrar resultado
        run: |
          echo "=== Ficheiros gerados ==="
          ls -lh results/audio/
          echo ""
          echo "=== Metadata ==="
          cat results/audio/metadata.json

      - name: Limpar modelo
        if: always()
        run: rm -rf venv_kokoro kokoro_model

      - name: Upload — Narração
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-pt-${{ github.event.inputs.voz }}-${{ github.event.inputs.bloco }}
          path: results/audio/
          retention-days: 14
          if-no-files-found: error
