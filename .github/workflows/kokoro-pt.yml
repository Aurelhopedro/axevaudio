name: AXEV — Kokoro Narração PT

on:
  workflow_dispatch:
    inputs:
      texto_custom:
        description: |
          Texto personalizado (opcional). Se preenchido, substitui o texto padrão.
          Podes colar aqui directamente o teu texto — mesmo que seja muito longo,
          será dividido automaticamente em partes e cada uma gera um áudio separado.
        required: false
        default: ''
      bloco:
        description: 'Qual bloco narrar? (ignorado se "texto_custom" estiver preenchido)'
        required: true
        default: 'TODOS'
        type: choice
        options:
          - TODOS
          - BLOCO_1
          - BLOCO_2
          - BLOCO_3
          - BLOCO_4
          - BLOCO_5
      voz:
        description: 'Voz portuguesa'
        required: true
        default: 'pf_dora'
        type: choice
        options:
          - pf_dora
          - pm_alex
          - pm_santa
      velocidade:
        description: 'Velocidade da narração (0.8 = lenta, 1.0 = normal, 1.2 = rápida)'
        required: true
        default: '1.0'
        type: choice
        options:
          - '0.8'
          - '0.9'
          - '1.0'
          - '1.1'
          - '1.2'
      formato:
        description: 'Formato de saída'
        required: true
        default: 'wav+mp3'
        type: choice
        options:
          - wav+mp3
          - wav
          - mp3
      limite_chars:
        description: 'Máximo de caracteres por parte (padrão: 800). Textos maiores são divididos automaticamente.'
        required: true
        default: '800'
        type: choice
        options:
          - '400'
          - '600'
          - '800'
          - '1000'
          - '1200'

# ══════════════════════════════════════════════════════════════════════
# TEXTOS PADRÃO — HUMANIDADE E O FUTURO
# Para usar um texto diferente, preenche "texto_custom" no input acima
# ══════════════════════════════════════════════════════════════════════
env:
  BLOCO_1: >-
    A humanidade e o futuro.
    Esta disciplina procura compreender para onde caminha a humanidade
    e que consequências as decisões do presente podem ter no futuro.
    No passado, a ciência concentrava-se sobretudo em estudar o que já aconteceu.
    Actualmente, também procura compreender o que poderá acontecer.
    Surgem assim os estudos prospectivos,
    estudos que procuram antecipar cenários futuros
    a partir das tendências e conhecimentos do presente.

  BLOCO_2: >-
    O tempo avança numa direcção, mas o futuro não precisa de estar completamente determinado.
    A flecha do tempo é uma metáfora proposta pelo físico Arthur Eddington,
    em mil novecentos e vinte e sete,
    para representar a direcção do tempo: do passado para o presente,
    e do presente para o futuro.
    Certos acontecimentos naturais acontecem numa direcção e não podem ser invertidos.
    Um copo que se parte não regressa espontaneamente à sua forma original.
    O envelhecimento humano não pode ser revertido naturalmente.

  BLOCO_3: >-
    O futuro não é necessariamente único, fixo ou completamente determinado.
    Existem várias possibilidades que podem acontecer.
    O ser humano pode tomar decisões.
    As decisões podem alterar o rumo dos acontecimentos.
    Diferentes escolhas podem produzir diferentes consequências.
    Uma decisão tomada hoje pode alterar o futuro de uma pessoa,
    de uma sociedade ou de uma nação.

  BLOCO_4: >-
    A maneira como o ser humano compreende o mundo não permanece sempre igual.
    Um paradigma é um modelo, uma referência, uma estrutura de pensamento
    que orienta a maneira como interpretamos a realidade.
    É como uma lente através da qual observamos o mundo.
    Dependendo da lente que utilizamos,
    podemos interpretar o mesmo fenómeno de maneiras completamente diferentes.

  BLOCO_5: >-
    Do mecanicismo ao holismo.
    O mecanicismo compreende a realidade através de partes separadas.
    O holismo procura compreender o todo e as relações entre as suas partes.
    Para compreender a saúde de uma pessoa, não basta analisar um órgão isoladamente.
    É necessário considerar o organismo, o ambiente
    e todos os factores que influenciam a vida.
    A realidade é complexa e interligada.

jobs:
  narrar:
    name: "🎙️ Kokoro PT — ${{ github.event.inputs.voz }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Verificar ambiente
        run: |
          python3 --version
          free -h && df -h /

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Instalar kokoro-onnx
        run: |
          python3 -m venv venv_kokoro
          source venv_kokoro/bin/activate
          pip install --quiet --upgrade pip wheel
          pip install --quiet kokoro-onnx soundfile numpy
          python -c "import kokoro_onnx; print('✓ kokoro-onnx OK')"

      - name: Descarregar modelo Kokoro ONNX
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import urllib.request, os
          os.makedirs("kokoro_model", exist_ok=True)
          files = {
            "kokoro.onnx": "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx",
            "voices.bin":  "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin",
          }
          for name, url in files.items():
            print(f"A descarregar {name}...")
            urllib.request.urlretrieve(url, f"kokoro_model/{name}")
          print("✓ Modelo pronto")
          PYEOF

      - name: Preparar texto para narração
        run: |
          CUSTOM="${{ github.event.inputs.texto_custom }}"
          BLOCO="${{ github.event.inputs.bloco }}"

          if [ -n "$CUSTOM" ]; then
            echo "Modo: texto personalizado"
            printf '%s' "$CUSTOM" > narration_text.txt
          elif [ "$BLOCO" = "TODOS" ]; then
            echo "Modo: todos os blocos"
            {
              printf '%s\n\n' "$BLOCO_1"
              printf '%s\n\n' "$BLOCO_2"
              printf '%s\n\n' "$BLOCO_3"
              printf '%s\n\n' "$BLOCO_4"
              printf '%s'    "$BLOCO_5"
            } > narration_text.txt
          else
            echo "Modo: bloco $BLOCO"
            case "$BLOCO" in
              BLOCO_1) printf '%s' "$BLOCO_1" > narration_text.txt ;;
              BLOCO_2) printf '%s' "$BLOCO_2" > narration_text.txt ;;
              BLOCO_3) printf '%s' "$BLOCO_3" > narration_text.txt ;;
              BLOCO_4) printf '%s' "$BLOCO_4" > narration_text.txt ;;
              BLOCO_5) printf '%s' "$BLOCO_5" > narration_text.txt ;;
            esac
          fi

          echo "=== Texto a narrar ==="
          cat narration_text.txt
          echo "======================"
          echo "Caracteres: $(wc -c < narration_text.txt)"
        env:
          BLOCO_1: ${{ env.BLOCO_1 }}
          BLOCO_2: ${{ env.BLOCO_2 }}
          BLOCO_3: ${{ env.BLOCO_3 }}
          BLOCO_4: ${{ env.BLOCO_4 }}
          BLOCO_5: ${{ env.BLOCO_5 }}

      - name: Dividir texto e gerar narração por partes
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import kokoro_onnx, soundfile as sf, json, os, time, re
          import numpy as np

          VOICE       = "${{ github.event.inputs.voz }}"
          SPEED       = float("${{ github.event.inputs.velocidade }}")
          BLOCO       = "${{ github.event.inputs.bloco }}"
          LIMITE      = int("${{ github.event.inputs.limite_chars }}")
          IS_CUSTOM   = bool("${{ github.event.inputs.texto_custom }}".strip())

          with open("narration_text.txt", "r") as f:
            TEXT = f.read().strip()

          os.makedirs("results/audio/partes", exist_ok=True)
          label = "custom" if IS_CUSTOM else BLOCO.lower()

          # ── Divisão inteligente por frases ──────────────────────────────
          # Divide por pontuação final (. ! ?) respeitando abreviaturas comuns.
          # Nunca corta a meio de uma frase.
          def dividir_em_partes(texto, limite):
            """
            Divide o texto em partes de no máximo `limite` caracteres,
            cortando sempre no fim de uma frase (. ! ? : —) ou parágrafo.
            """
            # Separar em frases usando pontuação final
            frases = re.split(r'(?<=[.!?])\s+', texto)
            partes = []
            parte_atual = ""

            for frase in frases:
              frase = frase.strip()
              if not frase:
                continue
              # Se a frase sozinha já excede o limite, subdivide por vírgulas
              if len(frase) > limite:
                sub_frases = re.split(r'(?<=,)\s+', frase)
                for sub in sub_frases:
                  if len(parte_atual) + len(sub) + 1 <= limite:
                    parte_atual = (parte_atual + " " + sub).strip()
                  else:
                    if parte_atual:
                      partes.append(parte_atual)
                    parte_atual = sub
              else:
                if len(parte_atual) + len(frase) + 1 <= limite:
                  parte_atual = (parte_atual + " " + frase).strip()
                else:
                  if parte_atual:
                    partes.append(parte_atual)
                  parte_atual = frase

            if parte_atual:
              partes.append(parte_atual)

            return partes

          partes = dividir_em_partes(TEXT, LIMITE)
          total  = len(partes)

          print(f"{'='*55}")
          print(f"Voz      : {VOICE}")
          print(f"Speed    : {SPEED}")
          print(f"Label    : {label}")
          print(f"Total    : {len(TEXT)} caracteres")
          print(f"Limite   : {LIMITE} chars/parte")
          print(f"Partes   : {total}")
          print(f"{'='*55}\n")

          # Guardar plano de divisão
          plano = []
          for i, p in enumerate(partes, 1):
            plano.append({"parte": i, "chars": len(p), "preview": p[:80] + ("..." if len(p) > 80 else "")})
            print(f"[Parte {i:02d}/{total:02d}] {len(p)} chars — {p[:60]}...")

          with open("results/audio/plano_divisao.json", "w") as f:
            json.dump({"total_partes": total, "limite_chars": LIMITE, "partes": plano},
                      f, indent=2, ensure_ascii=False)

          print(f"\n{'='*55}")
          print("A inicializar Kokoro ONNX...")
          kokoro = kokoro_onnx.Kokoro("kokoro_model/kokoro.onnx", "kokoro_model/voices.bin")
          print("✓ Modelo carregado\n")

          # ── Gerar áudio para cada parte ──────────────────────────────────
          meta_partes  = []
          samples_full = []
          sr_global    = None
          tempo_total  = 0

          for i, parte in enumerate(partes, 1):
            nome_ficheiro = f"results/audio/partes/parte_{i:02d}_{label}.wav"
            print(f"\n▶ Parte {i:02d}/{total:02d} ({len(parte)} chars)")
            print(f"  Texto: {parte[:80]}{'...' if len(parte) > 80 else ''}")

            t0 = time.time()
            try:
              samples, sr = kokoro.create(parte, voice=VOICE, speed=SPEED, lang="pt-br")
              elapsed = time.time() - t0
              dur     = len(samples) / sr
              tempo_total += elapsed

              sf.write(nome_ficheiro, samples, sr)
              print(f"  ✓ {nome_ficheiro} | {dur:.1f}s áudio | {elapsed:.1f}s geração")

              meta_partes.append({
                "parte": i, "chars": len(parte),
                "file": nome_ficheiro,
                "duration_s": round(dur, 2),
                "generation_s": round(elapsed, 2),
                "status": "OK"
              })

              # Acumular para o ficheiro completo
              if sr_global is None:
                sr_global = sr
              # Pequena pausa de silêncio entre partes (0.4s)
              if samples_full:
                silencio = np.zeros(int(sr_global * 0.4), dtype=samples.dtype)
                samples_full.append(silencio)
              samples_full.append(samples)

            except Exception as e:
              print(f"  ✗ ERRO: {e}")
              meta_partes.append({"parte": i, "status": "ERROR", "error": str(e)})

          # ── Concatenar todas as partes num ficheiro único ────────────────
          ok_partes = [m for m in meta_partes if m["status"] == "OK"]
          if len(ok_partes) > 1 and samples_full and sr_global:
            print(f"\n{'='*55}")
            print("A concatenar todas as partes num ficheiro único...")
            full_samples = np.concatenate(samples_full)
            out_full     = f"results/audio/{VOICE}_{label}_completo.wav"
            sf.write(out_full, full_samples, sr_global)
            dur_total = len(full_samples) / sr_global
            print(f"✓ {out_full} | {dur_total:.1f}s total")
          elif len(ok_partes) == 1:
            # Apenas uma parte — copia directamente como completo
            import shutil
            src = ok_partes[0]["file"]
            out_full = f"results/audio/{VOICE}_{label}_completo.wav"
            shutil.copy(src, out_full)
            dur_total = ok_partes[0]["duration_s"]

          # ── Metadata final ───────────────────────────────────────────────
          meta_final = {
            "voice": VOICE, "speed": SPEED, "label": label,
            "total_chars": len(TEXT), "limite_chars": LIMITE,
            "total_partes": total, "partes_ok": len(ok_partes),
            "tempo_geracao_total_s": round(tempo_total, 2),
            "ficheiro_completo": out_full if ok_partes else None,
            "duracao_total_s": round(dur_total, 2) if ok_partes else 0,
            "partes": meta_partes
          }
          with open("results/audio/metadata.json", "w") as f:
            json.dump(meta_final, f, indent=2, ensure_ascii=False)

          print(f"\n{'='*55}")
          print(f"✅ Concluído!")
          print(f"   Partes geradas : {len(ok_partes)}/{total}")
          print(f"   Duração total  : {round(dur_total, 1) if ok_partes else 0}s")
          print(f"   Tempo geração  : {round(tempo_total, 1)}s")
          PYEOF

      - name: Converter para MP3
        if: ${{ contains(github.event.inputs.formato, 'mp3') }}
        run: |
          shopt -s nullglob
          echo "=== A converter WAV → MP3 ==="
          # Partes individuais
          for wav in results/audio/partes/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
            echo "✓ ${wav%.wav}.mp3"
          done
          # Ficheiro completo
          for wav in results/audio/*_completo.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
            echo "✓ ${wav%.wav}.mp3"
          done

      - name: Remover WAV (se formato só MP3)
        if: ${{ github.event.inputs.formato == 'mp3' }}
        run: |
          rm -f results/audio/partes/*.wav
          rm -f results/audio/*_completo.wav

      - name: Mostrar resultado final
        run: |
          echo "=== Estrutura de ficheiros ==="
          find results/audio -type f | sort
          echo ""
          echo "=== Tamanhos ==="
          ls -lh results/audio/ 2>/dev/null || true
          ls -lh results/audio/partes/ 2>/dev/null || true
          echo ""
          echo "=== Metadata ==="
          cat results/audio/metadata.json

      - name: Limpar modelo
        if: always()
        run: rm -rf venv_kokoro kokoro_model

      - name: Upload — Partes individuais
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-partes-${{ github.event.inputs.voz }}
          path: results/audio/partes/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload — Áudio completo + metadata
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-completo-${{ github.event.inputs.voz }}
          path: |
            results/audio/*_completo.*
            results/audio/metadata.json
            results/audio/plano_divisao.json
          retention-days: 14
          if-no-files-found: error
