name: AXEV Voice Lab — TTS Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo a testar'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - kokoro
          - chatterbox
          - piper
          - supertonic
      mode:
        description: 'Modo de execução'
        required: true
        default: 'AUDITION'
        type: choice
        options:
          - AUDITION
          - FULL
      language:
        description: 'Variante de português preferida'
        required: true
        default: 'pt-BR'
        type: choice
        options:
          - pt-BR
          - pt-PT
      selected_voice:
        description: 'Voz para modo FULL (ex: pf_dora). Vazio em AUDITION.'
        required: false
        default: ''
      output_format:
        description: 'Formato de saída'
        required: true
        default: 'wav+mp3'
        type: choice
        options:
          - wav+mp3
          - wav
          - mp3

env:
  AUDITION_TEXT: >-
    Será que o tempo tem uma direção?
    A flecha do tempo é uma metáfora utilizada para representar a direção do tempo,
    isto é, a passagem do passado para o presente e do presente para o futuro.
    Esta expressão é atribuída ao físico Arthur Eddington, em mil novecentos e vinte e sete.
    Imaginemos que temos um copo de vidro e que, acidentalmente, o deixamos cair ao chão.
    O copo parte-se em vários pedaços.
    Não conseguimos fazer com que esse acontecimento nunca tenha ocorrido.
    É precisamente isso que significa irreversibilidade.
    O ser humano não é apenas um espectador do tempo,
    é também um participante na construção da sua própria história e do futuro da humanidade.

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — KOKORO via ONNX
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  kokoro:
    name: "🎙️ Kokoro-82M (ONNX)"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'ALL' || github.event.inputs.model == 'kokoro' }}
    timeout-minutes: 45

    steps:
      - name: Verificar ambiente
        run: |
          python3 --version && pip3 --version
          free -h && df -h /

      - name: Instalar espeak-ng e ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Instalar kokoro-onnx (sem spacy/blis)
        run: |
          python3 -m venv venv_kokoro
          source venv_kokoro/bin/activate
          pip install --quiet --upgrade pip wheel
          pip install --quiet kokoro-onnx soundfile numpy
          python -c "import kokoro_onnx; print('✓ kokoro-onnx OK')"

      - name: Descarregar modelo e vozes pt-BR
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import urllib.request, os, zipfile

          os.makedirs("kokoro_model", exist_ok=True)
          os.makedirs("results/kokoro/audition", exist_ok=True)

          model_url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          voices_url = "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"

          print("A descarregar modelo kokoro ONNX...")
          urllib.request.urlretrieve(model_url, "kokoro_model/kokoro.onnx")
          print("A descarregar vozes...")
          urllib.request.urlretrieve(voices_url, "kokoro_model/voices.bin")
          print("✓ Pronto")
          PYEOF

      - name: Gerar amostras de audição — Kokoro
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import kokoro_onnx, soundfile as sf, json, os, time, numpy as np

          TEXT   = os.environ["AUDITION_TEXT"]
          VOICES = ["pf_dora", "pm_alex", "pm_santa"]
          os.makedirs("results/kokoro/audition", exist_ok=True)
          meta = {"model": "kokoro-82m-onnx", "lang": "pt-BR", "samples": []}

          print("A inicializar Kokoro ONNX...")
          kokoro = kokoro_onnx.Kokoro("kokoro_model/kokoro.onnx", "kokoro_model/voices.bin")

          for v in VOICES:
            print(f"\n→ Voz: {v}")
            t0 = time.time()
            try:
              samples, sr = kokoro.create(TEXT, voice=v, speed=1.0, lang="pt-br")
              out = f"results/kokoro/audition/{v}.wav"
              sf.write(out, samples, sr)
              dur = len(samples) / sr
              gen = time.time() - t0
              print(f"  ✓ {out} | {dur:.1f}s áudio | {gen:.1f}s geração")
              meta["samples"].append({"voice": v, "file": out,
                "duration_s": round(dur, 2), "generation_s": round(gen, 2), "status": "OK"})
            except Exception as e:
              print(f"  ✗ Erro: {e}")
              meta["samples"].append({"voice": v, "status": "ERROR", "error": str(e)})

          with open("results/kokoro/metadata.json", "w") as f:
            json.dump(meta, f, indent=2, ensure_ascii=False)
          ok = sum(1 for s in meta["samples"] if s["status"] == "OK")
          print(f"\n=== Kokoro: {ok}/{len(VOICES)} vozes OK ===")
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/kokoro/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar
        if: always()
        run: |
          rm -rf venv_kokoro kokoro_model
          free -h && df -h /

      - name: Upload — Kokoro
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-results
          path: results/kokoro/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — CHATTERBOX MULTILINGUAL
# ══════════════════════════════════════════════════════════════════════════════
  chatterbox:
    name: "🎙️ Chatterbox Multilingual"
    runs-on: ubuntu-latest
    needs: kokoro
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'chatterbox')
    timeout-minutes: 60

    steps:
      - name: Verificar recursos
        run: free -h && df -h /

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Criar venv e instalar Chatterbox
        run: |
          python3 -m venv venv_chatterbox
          source venv_chatterbox/bin/activate
          pip install --quiet --upgrade pip wheel
          pip install --quiet chatterbox-tts soundfile numpy
          echo "✓ Chatterbox instalado"

      - name: Verificar RAM disponível
        run: |
          RAM_MB=$(free -m | awk '/Mem:/ {print $7}')
          echo "RAM disponível: ${RAM_MB} MB"
          if [ "${RAM_MB}" -lt 2500 ]; then
            echo "AVISO: RAM pode ser insuficiente para Chatterbox (~3 GB necessários)"
          fi

      - name: Gerar amostras de audição — Chatterbox
        run: |
          source venv_chatterbox/bin/activate
          python - <<'PYEOF'
          import json, os, time
          TEXT = os.environ["AUDITION_TEXT"]
          LANG = "${{ github.event.inputs.language }}"
          os.makedirs("results/chatterbox/audition", exist_ok=True)
          meta = {"model": "chatterbox-multilingual", "lang": LANG, "samples": []}
          try:
            import torchaudio as ta
            from chatterbox.mtl_tts import ChatterboxMultilingualTTS
            print("A carregar Chatterbox Multilingual em CPU...")
            t0 = time.time()
            model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
            print(f"Carregado em {time.time()-t0:.1f}s")
            t0 = time.time()
            wav = model.generate(TEXT, lang="pt", exaggeration=0.5, cfg_weight=0.5)
            elapsed = time.time() - t0
            out = f"results/chatterbox/audition/chatterbox_{LANG}.wav"
            ta.save(out, wav, model.sr)
            dur = wav.shape[-1] / model.sr
            print(f"✓ {out} | {dur:.1f}s | {elapsed:.1f}s")
            meta["samples"].append({"voice": f"default_{LANG}", "file": out,
              "duration_s": round(dur, 2), "generation_s": round(elapsed, 2), "status": "OK"})
          except Exception as e:
            import traceback; traceback.print_exc()
            meta["samples"].append({"status": "ERROR", "error": str(e)})
          with open("results/chatterbox/metadata.json", "w") as f:
            json.dump(meta, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          wavs=(results/chatterbox/audition/*.wav)
          if [ ${#wavs[@]} -eq 0 ]; then echo "Sem WAV para converter"; exit 0; fi
          for wav in "${wavs[@]}"; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar
        if: always()
        run: |
          rm -rf venv_chatterbox ~/.cache/huggingface/hub/models--ResembleAI*
          df -h /

      - name: Upload — Chatterbox
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-results
          path: results/chatterbox/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — PIPER TTS
# ══════════════════════════════════════════════════════════════════════════════
  piper:
    name: "🎙️ Piper TTS"
    runs-on: ubuntu-latest
    needs: chatterbox
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'piper')
    timeout-minutes: 20

    steps:
      - name: Verificar recursos
        run: free -h && df -h /

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg wget

      - name: Criar venv e instalar Piper
        run: |
          python3 -m venv venv_piper
          source venv_piper/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet piper-tts
          echo "✓ Piper instalado"

      - name: Descarregar voz portuguesa
        run: |
          mkdir -p piper_voices
          LANG="${{ github.event.inputs.language }}"
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"
          if [ "$LANG" = "pt-BR" ]; then
            NAME="pt_BR-faber-medium"
            HF_PATH="pt/pt_BR/faber/medium/${NAME}"
          else
            NAME="pt_PT-tugao-medium"
            HF_PATH="pt/pt_PT/tugao/medium/${NAME}"
          fi
          wget -q "${BASE}/${HF_PATH}.onnx"      -O "piper_voices/${NAME}.onnx"
          wget -q "${BASE}/${HF_PATH}.onnx.json" -O "piper_voices/${NAME}.onnx.json"
          echo "VOICE_FILE=piper_voices/${NAME}.onnx" >> $GITHUB_ENV
          ls -lh piper_voices/

      - name: Gerar amostras de audição — Piper
        run: |
          source venv_piper/bin/activate
          python - <<'PYEOF'
          from piper import PiperVoice
          import wave, json, os, time
          TEXT       = os.environ["AUDITION_TEXT"]
          VOICE_FILE = os.environ["VOICE_FILE"]
          LANG       = "${{ github.event.inputs.language }}"
          os.makedirs("results/piper/audition", exist_ok=True)
          meta = {"model": "piper", "lang": LANG, "samples": []}
          try:
            print(f"A carregar: {VOICE_FILE}")
            voice = PiperVoice.load(VOICE_FILE)
            out   = f"results/piper/audition/piper_{LANG}.wav"
            t0    = time.time()
            with wave.open(out, "w") as wf:
              voice.synthesize(TEXT, wf)
            elapsed = time.time() - t0
            with wave.open(out) as wf:
              dur = wf.getnframes() / wf.getframerate()
            print(f"✓ {out} | {dur:.1f}s | {elapsed:.1f}s")
            meta["samples"].append({"voice": f"piper_{LANG}", "file": out,
              "duration_s": round(dur, 2), "generation_s": round(elapsed, 2), "status": "OK"})
          except Exception as e:
            import traceback; traceback.print_exc()
            meta["samples"].append({"status": "ERROR", "error": str(e)})
          with open("results/piper/metadata.json", "w") as f:
            json.dump(meta, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}
          VOICE_FILE: ${{ env.VOICE_FILE }}

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/piper/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar
        if: always()
        run: rm -rf piper_voices venv_piper && df -h /

      - name: Upload — Piper
        uses: actions/upload-artifact@v4
        with:
          name: piper-results
          path: results/piper/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — MMS PT (via sherpa-onnx)
# Fix: URL corrigido para huggingface.co/k2-fsa/sherpa-onnx-vits-mms-por
#      com --no-check-certificate e fallback via pip download_pretrained_model
# ══════════════════════════════════════════════════════════════════════════════
  supertonic:
    name: "🎙️ MMS Português (sherpa-onnx)"
    runs-on: ubuntu-latest
    needs: piper
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'supertonic')
    timeout-minutes: 30

    steps:
      - name: Verificar recursos
        run: free -h && df -h /

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng wget curl

      - name: Criar venv e instalar sherpa-onnx
        run: |
          python3 -m venv venv_supertonic
          source venv_supertonic/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet sherpa-onnx soundfile numpy
          echo "✓ sherpa-onnx instalado"

      - name: Descarregar modelo MMS Português
        run: |
          mkdir -p mms_model
          # URL corrigido: huggingface.co em vez de raw.githubusercontent
          # O repo k2-fsa/sherpa-onnx-vits-mms-por existe no HuggingFace Hub
          HF_BASE="https://huggingface.co/k2-fsa/sherpa-onnx-vits-mms-por/resolve/main"

          echo "A verificar conectividade ao HuggingFace..."
          curl -sI --max-time 10 "https://huggingface.co" | head -1

          echo "A descarregar model.onnx..."
          wget --no-check-certificate -q --show-progress \
               --retry-connrefused --waitretry=5 --tries=3 \
               "${HF_BASE}/model.onnx" -O mms_model/model.onnx || \
          curl -L --retry 3 --max-time 120 \
               "${HF_BASE}/model.onnx" -o mms_model/model.onnx

          echo "A descarregar tokens.txt..."
          wget --no-check-certificate -q \
               --retry-connrefused --waitretry=5 --tries=3 \
               "${HF_BASE}/tokens.txt" -O mms_model/tokens.txt || \
          curl -L --retry 3 --max-time 30 \
               "${HF_BASE}/tokens.txt" -o mms_model/tokens.txt

          # Ficheiros opcionais (não falham se ausentes)
          wget --no-check-certificate -q "${HF_BASE}/lexicon.txt" \
               -O mms_model/lexicon.txt 2>/dev/null || true
          wget --no-check-certificate -q "${HF_BASE}/date.fst" \
               -O mms_model/date.fst 2>/dev/null || true
          wget --no-check-certificate -q "${HF_BASE}/number.fst" \
               -O mms_model/number.fst 2>/dev/null || true

          echo "=== Ficheiros descarregados ==="
          ls -lh mms_model/

          # Validar que os ficheiros essenciais existem e têm tamanho > 0
          [ -s mms_model/model.onnx ]  || { echo "❌ model.onnx vazio ou ausente"; exit 1; }
          [ -s mms_model/tokens.txt ]  || { echo "❌ tokens.txt vazio ou ausente"; exit 1; }
          echo "✓ Ficheiros essenciais OK"

      - name: Gerar amostras de audição — MMS PT
        run: |
          source venv_supertonic/bin/activate
          python - <<'PYEOF'
          import sherpa_onnx, soundfile as sf, json, os, time

          TEXT = os.environ["AUDITION_TEXT"]
          LANG = "${{ github.event.inputs.language }}"
          os.makedirs("results/supertonic/audition", exist_ok=True)
          meta = {"model": "mms-por-sherpa-onnx", "lang": LANG, "samples": []}

          try:
            tts = sherpa_onnx.OfflineTts(
              sherpa_onnx.OfflineTtsConfig(
                model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                    model="mms_model/model.onnx",
                    tokens="mms_model/tokens.txt",
                    lexicon="mms_model/lexicon.txt" if os.path.exists("mms_model/lexicon.txt") else "",
                    data_dir="",
                  )
                ),
                max_num_sentences=1,
              )
            )
            t0 = time.time()
            audio = tts.generate(TEXT, sid=0, speed=1.0)
            elapsed = time.time() - t0
            out = "results/supertonic/audition/mms_pt.wav"
            sf.write(out, audio.samples, audio.sample_rate)
            dur = len(audio.samples) / audio.sample_rate
            print(f"✓ {out} | {dur:.1f}s | {elapsed:.1f}s")
            meta["samples"].append({"voice": "mms_pt", "file": out,
              "duration_s": round(dur, 2), "generation_s": round(elapsed, 2), "status": "OK"})
          except Exception as e:
            import traceback; traceback.print_exc()
            meta["samples"].append({"status": "ERROR", "error": str(e)})

          with open("results/supertonic/metadata.json", "w") as f:
            json.dump(meta, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/supertonic/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar
        if: always()
        run: |
          rm -rf venv_supertonic mms_model
          df -h /

      - name: Upload — MMS PT
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-results
          path: results/supertonic/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB FINAL — RELATÓRIO COMPARATIVO
# ══════════════════════════════════════════════════════════════════════════════
  report:
    name: "📊 Relatório Comparativo"
    runs-on: ubuntu-latest
    needs: [kokoro, chatterbox, piper, supertonic]
    if: always()

    steps:
      - name: Descarregar todos os artefactos
        uses: actions/download-artifact@v4
        with:
          path: all_results/

      - name: Gerar relatório
        run: |
          python3 - <<'PYEOF'
          import json, os, glob
          from datetime import datetime

          report = {"generated_at": datetime.utcnow().isoformat()+"Z",
                    "mode": "${{ github.event.inputs.mode }}",
                    "language": "${{ github.event.inputs.language }}", "models": []}

          md = ["# AXEV Voice Lab — Relatório Comparativo",
                f"\n**Data:** {datetime.utcnow().strftime('%Y-%m-%d %H:%M')} UTC",
                f"**Modo:** ${{ github.event.inputs.mode }} | **Língua:** ${{ github.event.inputs.language }}",
                "\n## Resultados\n",
                "| Modelo | Estado | Vozes OK | Duração Média (s) | Geração Média (s) |",
                "|--------|:------:|:--------:|:-----------------:|:-----------------:|"]

          for mf in sorted(glob.glob("all_results/*/metadata.json")):
            try:
              with open(mf) as f: meta = json.load(f)
              name   = meta.get("model", "?")
              status = meta.get("status", "OK")
              samps  = meta.get("samples", [])
              ok     = [s for s in samps if s.get("status") == "OK"]
              n      = len(ok)
              avg_d  = round(sum(s.get("duration_s", 0) for s in ok) / max(n, 1), 2)
              avg_g  = round(sum(s.get("generation_s", 0) for s in ok) / max(n, 1), 2)
              icon   = "✅" if n > 0 else ("⏭️" if "SKIP" in status else "❌")
              md.append(f"| {name} | {icon} | {n} | {avg_d} | {avg_g} |")
              report["models"].append({"model": name, "voices_ok": n,
                "avg_duration_s": avg_d, "avg_generation_s": avg_g})
            except Exception as e:
              print(f"Erro: {e}")

          md += ["\n## Próximos Passos",
                 "1. Descarregar artefactos de cada modelo",
                 "2. Ouvir os ficheiros `.wav` em `audition/`",
                 "3. Escolher a voz mais natural",
                 "4. Re-executar com **modo FULL** + **selected_voice** = ID da voz"]

          os.makedirs("reports", exist_ok=True)
          txt = "\n".join(md)
          with open("reports/comparison_report.md", "w") as f: f.write(txt)
          with open("reports/comparison.json", "w") as f:
            json.dump(report, f, indent=2, ensure_ascii=False)
          print(txt)
          PYEOF

      - name: Upload — Relatório
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: reports/
          retention-days: 30
