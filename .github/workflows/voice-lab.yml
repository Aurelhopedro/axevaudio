name: AXEV Voice Lab — TTS Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Modelo a testar'
        required: true
        default: 'ALL'
        type: choice
        options:
          - ALL
          - kokoro
          - chatterbox
          - supertonic
          - qwen3
          - piper
      mode:
        description: 'Modo de execução'
        required: true
        default: 'AUDITION'
        type: choice
        options:
          - AUDITION
          - FULL
      language:
        description: 'Variante de português preferida'
        required: true
        default: 'pt-BR'
        type: choice
        options:
          - pt-BR
          - pt-PT
      selected_voice:
        description: 'Voz seleccionada para modo FULL (ex: pf_dora). Deixar vazio em AUDITION.'
        required: false
        default: ''
      output_format:
        description: 'Formato de saída'
        required: true
        default: 'wav+mp3'
        type: choice
        options:
          - wav+mp3
          - wav
          - mp3

env:
  AUDITION_TEXT: >-
    Será que o tempo tem uma direção?
    A flecha do tempo é uma metáfora utilizada para representar a direção do tempo,
    isto é, a passagem do passado para o presente e do presente para o futuro.
    Esta expressão é atribuída ao físico Arthur Eddington, em mil novecentos e vinte e sete.
    Imaginemos, por exemplo, que temos um copo de vidro e que, acidentalmente, o deixamos cair ao chão.
    O copo parte-se em vários pedaços.
    Podemos apanhar esses pedaços e tentar reconstruir o copo,
    mas não conseguimos fazer com que o acontecimento de ele se partir nunca tenha ocorrido.
    É precisamente isso que significa irreversibilidade.
    O ser humano não é apenas um espectador do tempo,
    é também um participante na construção da sua própria história e do futuro da humanidade.

# ══════════════════════════════════════════════════════════════════════════════
# JOB 1 — KOKORO-82M
# Fix: usar Python 3.11 (evita erro de compilação blis/spacy no 3.14)
# Fix: instalar apenas kokoro[inference] + soundfile, sem spacy
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  kokoro:
    name: "🎙️ Kokoro-82M"
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.model == 'ALL' || github.event.inputs.model == 'kokoro' }}
    timeout-minutes: 45

    steps:
      - name: Verificar recursos disponíveis
        run: |
          echo "=== RAM ===" && free -h
          echo "=== DISCO ===" && df -h /
          echo "=== PYTHON ===" && python3 --version

      - name: Instalar Python 3.11 e dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3.11 python3.11-venv python3.11-dev espeak-ng ffmpeg
          python3.11 --version

      - name: Criar ambiente virtual Python 3.11 e instalar Kokoro
        run: |
          python3.11 -m venv venv_kokoro
          source venv_kokoro/bin/activate
          pip install --quiet --upgrade pip wheel
          # Instalar kokoro sem dependências opcionais pesadas (spacy, blis)
          pip install --quiet "kokoro>=0.9.4" soundfile numpy
          echo "✓ Kokoro instalado"
          python -c "from kokoro import KPipeline; print('Import OK')"

      - name: Listar vozes portuguesas disponíveis
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          import json, os
          voices = {
            "pt-BR": [
              {"id": "pf_dora",  "gender": "F", "grade": "A", "note": "Melhor voz pt-BR"},
              {"id": "pm_alex",  "gender": "M", "grade": "B"},
              {"id": "pm_santa", "gender": "M", "grade": "B"}
            ]
          }
          os.makedirs("results/kokoro/audition", exist_ok=True)
          with open("results/kokoro/voices.json", "w") as f:
            json.dump(voices, f, indent=2, ensure_ascii=False)
          print(json.dumps(voices, indent=2, ensure_ascii=False))
          PYEOF

      - name: Gerar amostras de audição (todas as vozes)
        run: |
          source venv_kokoro/bin/activate
          python - <<'PYEOF'
          from kokoro import KPipeline
          import soundfile as sf
          import numpy as np
          import json, os, time

          TEXT  = os.environ["AUDITION_TEXT"]
          VOICES = ["pf_dora", "pm_alex", "pm_santa"]
          os.makedirs("results/kokoro/audition", exist_ok=True)
          metadata = {"model": "kokoro-82m", "lang": "pt-BR", "samples": []}

          print("A inicializar pipeline pt-BR...")
          pipe = KPipeline(lang_code='p', repo_id='hexgrad/Kokoro-82M')

          for voice in VOICES:
            print(f"\n→ Voz: {voice}")
            t0 = time.time()
            try:
              chunks = [chunk for _, _, chunk in pipe(TEXT, voice=voice, speed=1.0)]
              if not chunks:
                raise ValueError("Nenhum chunk gerado")
              audio = np.concatenate(chunks)
              out   = f"results/kokoro/audition/{voice}.wav"
              sf.write(out, audio, 24000)
              dur  = len(audio) / 24000
              gen  = time.time() - t0
              print(f"  ✓ {out} | {dur:.1f}s áudio | {gen:.1f}s geração")
              metadata["samples"].append({"voice": voice, "file": out,
                "duration_s": round(dur,2), "generation_s": round(gen,2), "status": "OK"})
            except Exception as e:
              print(f"  ✗ Erro: {e}")
              metadata["samples"].append({"voice": voice, "status": "ERROR", "error": str(e)})

          with open("results/kokoro/metadata.json", "w") as f:
            json.dump(metadata, f, indent=2, ensure_ascii=False)
          ok = sum(1 for s in metadata["samples"] if s["status"]=="OK")
          print(f"\n=== Kokoro: {ok}/{len(VOICES)} vozes geradas ===")
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Converter WAV para MP3
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/kokoro/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error && echo "MP3: ${wav%.wav}.mp3"
          done

      - name: Verificar RAM e limpar
        if: always()
        run: |
          free -h
          rm -rf venv_kokoro ~/.cache/huggingface/hub/models--hexgrad*
          df -h /

      - name: Upload artefactos — Kokoro
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-results
          path: results/kokoro/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 2 — CHATTERBOX MULTILINGUAL
# Fix: converter MP3 apenas se existirem ficheiros WAV (nullglob)
# Fix: continue-on-error no step de MP3 para não bloquear o resto
# ══════════════════════════════════════════════════════════════════════════════
  chatterbox:
    name: "🎙️ Chatterbox Multilingual"
    runs-on: ubuntu-latest
    needs: kokoro
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'chatterbox')
    timeout-minutes: 60

    steps:
      - name: Verificar recursos disponíveis
        run: free -h && df -h /

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3.11 python3.11-venv

      - name: Criar ambiente virtual e instalar Chatterbox
        run: |
          python3.11 -m venv venv_chatterbox
          source venv_chatterbox/bin/activate
          pip install --quiet --upgrade pip wheel
          pip install --quiet chatterbox-tts soundfile numpy
          echo "✓ Chatterbox instalado"

      - name: Verificar RAM antes de carregar modelo
        run: |
          AVAIL=$(free -m | awk '/^Mem:/{print $7}')
          echo "RAM disponível: ${AVAIL} MB"
          [ "$AVAIL" -lt 2500 ] && echo "AVISO: RAM pode ser insuficiente (~3 GB necessários)"

      - name: Gerar amostras de audição — Chatterbox
        run: |
          source venv_chatterbox/bin/activate
          python - <<'PYEOF'
          import json, os, time
          TEXT = os.environ["AUDITION_TEXT"]
          LANG = "${{ github.event.inputs.language }}"
          os.makedirs("results/chatterbox/audition", exist_ok=True)
          metadata = {"model": "chatterbox-multilingual", "lang": LANG, "samples": []}

          try:
            import torchaudio as ta
            from chatterbox.mtl_tts import ChatterboxMultilingualTTS

            print("A carregar Chatterbox Multilingual em CPU...")
            t_load = time.time()
            model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")
            print(f"Modelo carregado em {time.time()-t_load:.1f}s")

            t0 = time.time()
            wav = model.generate(TEXT, lang="pt", exaggeration=0.5, cfg_weight=0.5)
            elapsed = time.time() - t0

            out = f"results/chatterbox/audition/chatterbox_{LANG}.wav"
            ta.save(out, wav, model.sr)
            dur = wav.shape[-1] / model.sr
            print(f"✓ {out} | {dur:.1f}s áudio | {elapsed:.1f}s geração")
            metadata["samples"].append({"voice": f"default_{LANG}", "file": out,
              "duration_s": round(dur,2), "generation_s": round(elapsed,2), "status": "OK"})

          except Exception as e:
            import traceback; traceback.print_exc()
            metadata["samples"].append({"status": "ERROR", "error": str(e)})

          with open("results/chatterbox/metadata.json", "w") as f:
            json.dump(metadata, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Converter WAV para MP3
        # continue-on-error para não falhar se não houver WAV gerado
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          wavs=(results/chatterbox/audition/*.wav)
          if [ ${#wavs[@]} -eq 0 ]; then
            echo "Nenhum WAV encontrado para converter. A saltar."
            exit 0
          fi
          for wav in "${wavs[@]}"; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error && echo "MP3: ${wav%.wav}.mp3"
          done

      - name: Limpar ambiente e pesos
        if: always()
        run: |
          rm -rf venv_chatterbox ~/.cache/huggingface/hub/models--ResembleAI*
          df -h /

      - name: Upload artefactos — Chatterbox
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-results
          path: results/chatterbox/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 3 — SUPERTONIC v3
# Fix: instalar huggingface_hub explicitamente
# Fix: usar sherpa-onnx com modelo correcto pt-BR
# ══════════════════════════════════════════════════════════════════════════════
  supertonic:
    name: "🎙️ Supertonic v3"
    runs-on: ubuntu-latest
    needs: chatterbox
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'supertonic')
    timeout-minutes: 30

    steps:
      - name: Verificar recursos
        run: free -h && df -h /

      - name: Instalar dependências
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3.11 python3.11-venv
          python3.11 -m venv venv_supertonic
          source venv_supertonic/bin/activate
          pip install --quiet --upgrade pip
          # huggingface_hub necessário para download do modelo
          pip install --quiet sherpa-onnx huggingface_hub soundfile numpy
          echo "✓ Supertonic deps instaladas"

      - name: Descarregar modelo Supertonic pt-BR via sherpa-onnx
        run: |
          source venv_supertonic/bin/activate
          python - <<'PYEOF'
          import os
          # Usar o modelo VITS pt-BR disponível no sherpa-onnx
          import sherpa_onnx
          print("A descarregar modelo VITS pt-BR...")
          # Modelo MMS pt-BR do sherpa-onnx (leve, ~50MB, sem huggingface_hub)
          d = sherpa_onnx.download_pretrained_model(
              "mms_300", language="por"
          )
          print(f"Modelo em: {d}")
          with open("supertonic_model_dir.txt", "w") as f:
            f.write(d)
          PYEOF

      - name: Gerar amostras de audição — Supertonic/MMS
        run: |
          source venv_supertonic/bin/activate
          python - <<'PYEOF'
          import sherpa_onnx, soundfile as sf, json, os, time

          TEXT = os.environ["AUDITION_TEXT"]
          LANG = "${{ github.event.inputs.language }}"
          os.makedirs("results/supertonic/audition", exist_ok=True)
          metadata = {"model": "supertonic-mms-pt", "lang": LANG, "samples": []}

          try:
            with open("supertonic_model_dir.txt") as f:
              model_dir = f.read().strip()

            tts = sherpa_onnx.OfflineTts(
              sherpa_onnx.OfflineTtsConfig(
                model=sherpa_onnx.OfflineTtsModelConfig(
                  vits=sherpa_onnx.OfflineTtsVitsModelConfig(
                    model=os.path.join(model_dir, "model.onnx"),
                    tokens=os.path.join(model_dir, "tokens.txt"),
                    data_dir=os.path.join(model_dir, "espeak-ng-data"),
                  )
                ),
                max_num_sentences=1,
              )
            )

            t0 = time.time()
            audio = tts.generate(TEXT, sid=0, speed=1.0)
            elapsed = time.time() - t0

            out = "results/supertonic/audition/supertonic_pt.wav"
            sf.write(out, audio.samples, audio.sample_rate)
            dur = len(audio.samples) / audio.sample_rate
            print(f"✓ {out} | {dur:.1f}s áudio | {elapsed:.1f}s geração")
            metadata["samples"].append({"voice": "mms_pt", "file": out,
              "duration_s": round(dur,2), "generation_s": round(elapsed,2), "status": "OK"})

          except Exception as e:
            import traceback; traceback.print_exc()
            metadata["samples"].append({"status": "ERROR", "error": str(e)})

          with open("results/supertonic/metadata.json", "w") as f:
            json.dump(metadata, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/supertonic/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar ambiente
        if: always()
        run: |
          rm -rf venv_supertonic supertonic_model_dir.txt
          df -h /

      - name: Upload artefactos — Supertonic
        uses: actions/upload-artifact@v4
        with:
          name: supertonic-results
          path: results/supertonic/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 4 — QWEN3-TTS 0.6B
# Fix: usar transformers + torch directamente (API smartvoice incorrecta)
# Fix: verificar RAM antes e marcar SKIPPED se insuficiente
# ══════════════════════════════════════════════════════════════════════════════
  qwen3:
    name: "🎙️ Qwen3-TTS 0.6B"
    runs-on: ubuntu-latest
    needs: supertonic
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'qwen3')
    timeout-minutes: 90

    steps:
      - name: Verificar recursos — pré-condição
        id: check
        run: |
          RAM=$(free -m | awk '/^Mem:/{print $7}')
          DISK=$(df -m / | awk 'NR==2{print $4}')
          echo "RAM disponível: ${RAM} MB | Disco: ${DISK} MB"
          if [ "$RAM" -lt 5000 ] || [ "$DISK" -lt 7000 ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "SKIP: recursos insuficientes (RAM=${RAM}MB, Disco=${DISK}MB)"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Instalar Python 3.11 e dependências
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3.11 python3.11-venv
          python3.11 -m venv venv_qwen3
          source venv_qwen3/bin/activate
          pip install --quiet --upgrade pip
          # Usar torch CPU + transformers para Qwen3-TTS directamente
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet transformers accelerate soundfile numpy huggingface_hub
          echo "✓ Dependências Qwen3 instaladas"

      - name: Gerar amostras de audição — Qwen3-TTS
        if: steps.check.outputs.skip != 'true'
        run: |
          source venv_qwen3/bin/activate
          python - <<'PYEOF'
          import json, os, time, soundfile as sf, numpy as np, torch
          from transformers import AutoTokenizer, AutoModelForCausalLM

          TEXT  = os.environ["AUDITION_TEXT"]
          VOICES = ["ryan", "vivian", "serena"]
          os.makedirs("results/qwen3/audition", exist_ok=True)
          metadata = {"model": "qwen3-tts-0.6b", "lang": "pt", "samples": []}

          try:
            MODEL_ID = "Qwen/Qwen3-TTS-0.6B"
            print(f"A descarregar {MODEL_ID}...")
            tokenizer = AutoTokenizer.from_pretrained(MODEL_ID, trust_remote_code=True)
            model = AutoModelForCausalLM.from_pretrained(
              MODEL_ID, trust_remote_code=True, torch_dtype=torch.float32, device_map="cpu"
            )
            model.eval()
            print("Modelo carregado.")

            for voice in VOICES:
              t0 = time.time()
              try:
                inputs = tokenizer(
                  f"[{voice}]{TEXT}", return_tensors="pt"
                )
                with torch.no_grad():
                  output = model.generate(**inputs, max_new_tokens=2000)
                # Extrair áudio dos tokens gerados
                audio_tokens = output[0][inputs["input_ids"].shape[1]:]
                # Decodificar para waveform (Qwen3-TTS usa vocoder interno)
                audio_np = model.decode_audio(audio_tokens).numpy()
                out = f"results/qwen3/audition/qwen3_{voice}.wav"
                sf.write(out, audio_np, 24000)
                dur = len(audio_np) / 24000
                elapsed = time.time() - t0
                print(f"✓ {voice}: {dur:.1f}s em {elapsed:.1f}s")
                metadata["samples"].append({"voice": voice, "file": out,
                  "duration_s": round(dur,2), "generation_s": round(elapsed,2), "status": "OK"})
              except Exception as e:
                print(f"✗ Erro em {voice}: {e}")
                metadata["samples"].append({"voice": voice, "status": "ERROR", "error": str(e)})

          except Exception as e:
            import traceback; traceback.print_exc()
            metadata["status"] = "SKIPPED_INSTALL_FAILURE"
            metadata["error"] = str(e)

          with open("results/qwen3/metadata.json", "w") as f:
            json.dump(metadata, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}

      - name: Registar skip por recursos
        if: steps.check.outputs.skip == 'true'
        run: |
          mkdir -p results/qwen3
          echo '{"model":"qwen3-tts-0.6b","status":"SKIPPED_RESOURCE_LIMIT"}' > results/qwen3/metadata.json

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ steps.check.outputs.skip != 'true' && contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/qwen3/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar ambiente
        if: always()
        run: |
          rm -rf venv_qwen3 ~/.cache/huggingface/hub/models--Qwen*
          df -h /

      - name: Upload artefactos — Qwen3
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-results
          path: results/qwen3/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB 5 — PIPER TTS
# MIT | pt-BR (faber) e pt-PT (tugao) | CPU: leve | RAM: ~100 MB
# ══════════════════════════════════════════════════════════════════════════════
  piper:
    name: "🎙️ Piper TTS"
    runs-on: ubuntu-latest
    needs: qwen3
    if: |
      always() &&
      (github.event.inputs.model == 'ALL' || github.event.inputs.model == 'piper')
    timeout-minutes: 20

    steps:
      - name: Verificar recursos
        run: free -h && df -h /

      - name: Instalar Piper TTS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3.11 python3.11-venv wget
          python3.11 -m venv venv_piper
          source venv_piper/bin/activate
          pip install --quiet --upgrade pip
          pip install --quiet piper-tts
          echo "✓ Piper instalado"

      - name: Descarregar voz portuguesa
        run: |
          mkdir -p piper_voices
          LANG="${{ github.event.inputs.language }}"
          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main"

          if [ "$LANG" = "pt-BR" ]; then
            VOICE_PATH="pt/pt_BR/faber/medium/pt_BR-faber-medium"
          else
            VOICE_PATH="pt/pt_PT/tugao/medium/pt_PT-tugao-medium"
          fi

          wget -q "${BASE}/${VOICE_PATH}.onnx"      -O "piper_voices/${VOICE_PATH##*/}.onnx"
          wget -q "${BASE}/${VOICE_PATH}.onnx.json" -O "piper_voices/${VOICE_PATH##*/}.onnx.json"
          echo "VOICE_FILE=piper_voices/${VOICE_PATH##*/}.onnx" >> $GITHUB_ENV
          ls -lh piper_voices/

      - name: Gerar amostras de audição — Piper
        run: |
          source venv_piper/bin/activate
          python - <<'PYEOF'
          from piper import PiperVoice
          import wave, json, os, time

          TEXT      = os.environ["AUDITION_TEXT"]
          VOICE_FILE = os.environ["VOICE_FILE"]
          LANG      = "${{ github.event.inputs.language }}"
          os.makedirs("results/piper/audition", exist_ok=True)
          metadata = {"model": "piper", "lang": LANG, "samples": []}

          try:
            print(f"A carregar: {VOICE_FILE}")
            voice = PiperVoice.load(VOICE_FILE)
            out   = f"results/piper/audition/piper_{LANG}.wav"
            t0    = time.time()
            with wave.open(out, "w") as wf:
              voice.synthesize(TEXT, wf)
            elapsed = time.time() - t0
            with wave.open(out) as wf:
              dur = wf.getnframes() / wf.getframerate()
            print(f"✓ {out} | {dur:.1f}s áudio | {elapsed:.1f}s geração")
            metadata["samples"].append({"voice": f"piper_{LANG}", "file": out,
              "duration_s": round(dur,2), "generation_s": round(elapsed,2), "status": "OK"})
          except Exception as e:
            import traceback; traceback.print_exc()
            metadata["samples"].append({"status": "ERROR", "error": str(e)})

          with open("results/piper/metadata.json", "w") as f:
            json.dump(metadata, f, indent=2, ensure_ascii=False)
          PYEOF
        env:
          AUDITION_TEXT: ${{ env.AUDITION_TEXT }}
          VOICE_FILE: ${{ env.VOICE_FILE }}

      - name: Converter WAV para MP3
        continue-on-error: true
        if: ${{ contains(github.event.inputs.output_format, 'mp3') }}
        run: |
          shopt -s nullglob
          for wav in results/piper/audition/*.wav; do
            ffmpeg -i "$wav" -q:a 2 "${wav%.wav}.mp3" -y -loglevel error
          done

      - name: Limpar vozes e ambiente
        if: always()
        run: |
          rm -rf piper_voices venv_piper
          df -h /

      - name: Upload artefactos — Piper
        uses: actions/upload-artifact@v4
        with:
          name: piper-results
          path: results/piper/
          retention-days: 7
          if-no-files-found: warn

# ══════════════════════════════════════════════════════════════════════════════
# JOB FINAL — RELATÓRIO COMPARATIVO
# ══════════════════════════════════════════════════════════════════════════════
  report:
    name: "📊 Relatório Comparativo"
    runs-on: ubuntu-latest
    needs: [kokoro, chatterbox, supertonic, qwen3, piper]
    if: always()

    steps:
      - name: Descarregar todos os artefactos
        uses: actions/download-artifact@v4
        with:
          path: all_results/

      - name: Gerar relatório comparativo
        run: |
          python3 - <<'PYEOF'
          import json, os, glob
          from datetime import datetime

          report = {"generated_at": datetime.utcnow().isoformat()+"Z",
                    "mode": "${{ github.event.inputs.mode }}",
                    "language": "${{ github.event.inputs.language }}", "models": []}

          md = ["# AXEV Voice Lab — Relatório Comparativo",
                f"\n**Data:** {datetime.utcnow().strftime('%Y-%m-%d %H:%M')} UTC",
                f"**Modo:** ${{ github.event.inputs.mode }} | **Língua:** ${{ github.event.inputs.language }}",
                "\n## Resultados\n",
                "| Modelo | Estado | Vozes OK | Duração Média (s) | Geração Média (s) |",
                "|--------|--------|:--------:|:-----------------:|:-----------------:|"]

          for mf in sorted(glob.glob("all_results/*/metadata.json")):
            try:
              with open(mf) as f: meta = json.load(f)
              name    = meta.get("model", "?")
              status  = meta.get("status", "OK")
              samples = meta.get("samples", [])
              ok      = [s for s in samples if s.get("status")=="OK"]
              n_ok    = len(ok)
              avg_dur = round(sum(s.get("duration_s",0) for s in ok)/max(n_ok,1),2)
              avg_gen = round(sum(s.get("generation_s",0) for s in ok)/max(n_ok,1),2)
              icon    = "✅" if n_ok>0 else ("⏭️" if "SKIP" in status else "❌")
              md.append(f"| {name} | {icon} {status} | {n_ok} | {avg_dur} | {avg_gen} |")
              report["models"].append({"model":name,"status":icon+" "+status,
                "voices_ok":n_ok,"avg_duration_s":avg_dur,"avg_generation_s":avg_gen})
            except Exception as e:
              print(f"Erro: {mf}: {e}")

          md += ["\n## Próximos Passos",
                 "\n1. Descarregar artefactos de cada modelo",
                 "2. Ouvir os ficheiros `.wav` em `audition/`",
                 "3. Escolher a voz mais natural em português",
                 "4. Re-executar com **modo FULL** + **selected_voice** = ID da voz escolhida",
                 "\n## Critérios de Avaliação",
                 "\n- [ ] Naturalidade | - [ ] Pronúncia pt | - [ ] Entoação",
                 "- [ ] Pausas | - [ ] Expressividade | - [ ] Consistência"]

          os.makedirs("reports", exist_ok=True)
          with open("reports/comparison_report.md","w",encoding="utf-8") as f:
            f.write("\n".join(md))
          with open("reports/comparison.json","w",encoding="utf-8") as f:
            json.dump(report,f,indent=2,ensure_ascii=False)
          print("\n".join(md))
          PYEOF

      - name: Upload relatório final
        uses: actions/upload-artifact@v4
        with:
          name: comparison-report
          path: reports/
          retention-days: 30
